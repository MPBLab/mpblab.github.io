# Publications shown on the Publications page, newest year first.
#
# Required: title, authors, year
# Optional: journal, volume, issue, pages (or article for an article number),
#           date (YYYY-MM-DD, used to order papers within a year), doi, url, type, topic
#   type:  journal, conference, book, chapter, thesis   (default: journal)
#   topic: one of the ids in _data/topics.yml
#   image: a figure from the paper in assets/img/pubs/ (otherwise a topic illustration is shown)
#   image_alt: short description of the figure; image_credit: figure number and licence
#   Only use figures from open-access papers (e.g. CC BY) or with the publisher's permission.
#   quartile: journal quartile, e.g. "Q1" (shown as a badge)
#
# Math: write LaTeX between $...$ (inline) or $$...$$ (displayed), and put
# that text in SINGLE quotes, e.g.  title: 'Solitons in $\kappa$-distributed plasmas'
# A real dollar sign is written \$.
#          (the paper then also appears on that research page)
#
# Example:
#
# - title: "Ion-acoustic solitary waves in a relativistic plasma"
#   authors: "A. Author, B. Author, M. G. Hafez"
#   journal: "Journal Name"
#   volume: "12"
#   pages: "123–130"
#   year: 2024
#   doi: "10.xxxx/xxxxx"
#   type: journal
#   topic: plasma-waves

