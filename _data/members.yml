# Lab members and co-authors.
#
# Built from the authors of the lab's papers. Each person appears once.
#
#   id:          used in web addresses (/members/#id) and for the photo file name
#   name:        full name as it should be shown
#   short:       short form used on publication cards (e.g. "T. S. Tanjil")
#   aliases:     every spelling of the name used in _data/publications.yml,
#                so papers are linked to the right person
#   group:       leader, members or collaborators
#   status:      what the person is now, which decides their section on the
#                Members page and the line shown under their name:
#                  faculty   - teaching staff (fill in position)
#                  ra        - research assistant
#                  postdoc   - postdoctoral researcher
#                  phd, mphil, msc, bsc - current student in that degree
#                  alumni    - finished their degree with the lab
#                (leave empty if not known yet; collaborators can leave it empty)
#   position:    faculty/collaborators: rank, e.g. "Assistant Professor";
#                alumni: what they do now, e.g. "Lecturer, XYZ University"
#   degree:      alumni only: the degree they finished, e.g. "MSc"
#   year:        students: year they started; alumni: year they graduated
#   department:  e.g. "Department of Mathematics"
#   affiliation: university (short form is fine, e.g. "CUET")
#   photo:       file name in assets/img/members/ (e.g. tokey-sifullah-tanjil.jpg);
#                leave empty to show initials
#   intro:       a few sentences introducing the person (optional)
#   links:       optional email, scholar, researchgate, orcid, website
#
# Groups were set from the affiliations recorded with each paper: co-authors at
# CUET are listed under "members", co-authors elsewhere under "collaborators".
# Please check them and move anyone to the right group.

