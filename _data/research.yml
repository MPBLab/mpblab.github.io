- field: physics
  name: Mathematical physics
  equation: '<var>u</var><sub>t</sub> + 6<var>u</var><var>u</var><sub>x</sub> + <var>u</var><sub>xxx</sub> = 0'
  equation_name: Korteweg–de Vries equation
  summary: >-
    How nonlinear waves form, travel and interact in plasmas, and the
    equations that describe them.
  topics:
    - name: Nonlinear waves in plasmas
      text: >-
        Ion-acoustic and positron-acoustic solitary waves and shock waves in
        relativistic and nonextensive plasmas, including plasmas found in
        space and astrophysical settings.
    - name: Nonlinear evolution equations
      text: >-
        Deriving Burgers, Korteweg–de Vries and Kadomtsev–Petviashvili type
        equations from plasma models, and finding their wave solutions.
    - name: Analytical and numerical methods
      text: >-
        Techniques for solving nonlinear partial differential equations and
        checking how solutions depend on the physical parameters.

- field: biology
  name: Mathematical biology
  equation: 'd<var>N</var>/d<var>t</var> = <var>r</var><var>N</var>(1 − <var>N</var>/<var>K</var>)'
  equation_name: Logistic growth equation
  summary: >-
    Differential-equation models of how populations, diseases and other
    living systems change over time.
  topics:
    - name: Population and epidemic dynamics
      text: >-
        Models of how populations grow and interact, and how infectious
        diseases spread through a community.
    - name: Stability and bifurcation analysis
      text: >-
        Finding when a biological system settles to a steady state, starts to
        oscillate, or changes behaviour as its parameters change.
