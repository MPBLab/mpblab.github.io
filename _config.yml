# ------------------------------------------------------------
#  Site settings for the MPB Lab website
#  After editing this file, the site rebuilds in about a minute.
# ------------------------------------------------------------

title: "Mathematical Physics & Biology Research Lab"
short_name: "MPB Lab"
description: >-
  The Mathematical Physics & Biology Research Lab (MPB Lab) studies nonlinear
  waves in plasmas and mathematical models of living systems. Led by
  Prof. Dr. Md. Golam Hafez, Department of Mathematics, CUET, Bangladesh.

leader: "Prof. Dr. Md. Golam Hafez"
leader_page: "/people/hafez/"
department: "Department of Mathematics"
institution: "Chittagong University of Engineering & Technology (CUET)"
institution_short: "CUET"
address:
  - "Department of Mathematics"
  - "Chittagong University of Engineering & Technology (CUET)"
  - "Chattogram 4349, Bangladesh"

# Banner background shown at the top of every page.
# Choose one of: waves, plasma, orbits, contours
# (a single page can use a different one with  banner: plasma  in its front matter)
banner: waves

# Contact email for the lab. Leave empty ("") to hide it on the site.
email: ""

# Optional profile links. Leave empty ("") to hide.
links:
  google_scholar: ""
  researchgate: ""
  orcid: ""
  github: "https://github.com/MPBLab"

url: "https://mpblab.github.io"
baseurl: ""

# ---------- Search engines ----------
# Shown after the lab name in the home page title in search results.
tagline: "Department of Mathematics, CUET, Bangladesh"
lang: en_US
logo: /assets/img/logo.png
image: /assets/img/share.jpg
social:
  name: "Mathematical Physics & Biology Research Lab"
  links:
    - "https://github.com/MPBLab"

# Verification codes from Google Search Console and Bing Webmaster Tools.
# To use: remove the # in front of the three lines below and paste each code
# (only the part inside content="...").
# webmaster_verifications:
#   google: "PASTE-GOOGLE-CODE-HERE"
#   bing: "PASTE-BING-CODE-HERE"

# ---------- Visitor statistics ----------
# Fill in one (or both) to start counting visitors. Leave empty to turn off.
#   goatcounter: the code you chose at goatcounter.com, e.g. "mpblab"
#                (statistics at https://CODE.goatcounter.com)
#   google:      a Google Analytics 4 measurement ID, e.g. "G-ABC123XYZ"
analytics:
  goatcounter: "mpblab"
  google: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  math_engine: mathjax
permalink: pretty

# Research area pages live in the _research folder (one file per area).
collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/share.jpg
  - scope:
      path: ""
      type: research
    values:
      layout: research-area
      math: true
      seo:
        type: WebPage

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
